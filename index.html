<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>The Ambassadors School, Ota</h1>
        <p>Student Management System</p>
    </header>

    <main>

        <!-- Registration Form -->
        <section class="form-section">

            <h2>Student Registration</h2>

            <form id="studentForm">

                <label for="studentName">Student Full Name</label>
                <input type="text" id="studentName" required>

                <label for="studentClass">Student Class</label>
                <select id="studentClass" required>
                    <option value="">select class</option>
                    <option value="SS1">SS1</option>
                    <option value="SS2">SS2</option>
                    <option value="SS3"> SS3</option>
                    </select> 
                      
                <label for="homeaddress">Home address</label>
                <textarea id="homeAddress" rows="3"
                    placeholder="Enter student's home address"required>
                </textarea>

                <label for="email">Email address</label>
                <input type="email" id="email" placeholder="Enter your email address">

                
                <label>Subject</label>

<div class="subjects-container">

    <label>
        <input type="checkbox" name="subjects" value="Mathematics">
        Mathematics
    </label>

    <label>
        <input type="checkbox" name="subjects" value="English">
        English
    </label>

    <label>
        <input type="checkbox" name="subjects" value="Civic Education">
        Civic Education
    </label>

    <label>
        <input type="checkbox" name="subjects" value="Biology">
        Biology
    </label>

    <label>
        <input type="checkbox" name="subjects" value="Chemistry">
        Chemistry
    </label>

    <label>
        <input type="checkbox" name="subjects" value="Physics">
        Physics
    </label>

    <label>
        <input type="checkbox" name="subjects" value="Further Mathematics">
        Further Mathematics
    </label>

    <label>
        <input type="checkbox" name="subjects" value="Government">
        Government
    </label>

    <label>
        <input type="checkbox" name="subjects" value="Literature-in-English">
        Literature-in-English
    </label>

    <label>
        <input type="checkbox" name="subjects" value="History">
        History
    </label>

    <label>
        <input type="checkbox" name="subjects" value="CRS">
        CRS
    </label>

    <label>
        <input type="checkbox" name="subjects" value="Economics">
        Economics
    </label>

    <label>
        <input type="checkbox" name="subjects" value="Financial Accounting">
        Financial Accounting
    </label>

    <label>
        <input type="checkbox" name="subjects" value="Commerce">
        Commerce
    </label>

    <label>
        <input type="checkbox" name="subjects" value="Book Keeping">
        Book Keeping
    </label>

    <label>
        <input type="checkbox" name="subjects" value="Marketing">
        Marketing
    </label>

</div> 
               
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob">

                <label for="gender">Gender</label>
                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>

                <label for="PhoneNo">Parent/Guardian Phone Number</label>
                <input type="text" maxlength="11" id="PhoneNo" placeholder="Enter parent/Guardian Phone number" required>
                    

                <button type="submit" id="submitButton">
                    Add Student
                </button>

            </form>

        </section>
        
    </main>
        <footer>
            <p>Thanks for your cooperation</p>
        </footer>


    <script src="script.js"></script>

</body>
</html>
