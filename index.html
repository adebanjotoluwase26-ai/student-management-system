<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>The Ambassadors School, Ota</h1>
        <p>Student Management System</p>
    </header>

    <main>

        <!-- Registration Form -->
        <section class="form-section">

            <h2>Student Registration</h2>

            <form id="studentForm">

                <label for="studentName">Student Name</label>
                <input type="text" id="studentName" required>

                <label for="studentClass">Student Class</label>
                <select id="studentClass" required>
                    <option value="">select class</option>
                    <option value="SS1">SS1</option>
                    <option value="SS2">SS2</option>
                    <option value="SS3"> SS3</option>
                    </select>   
                <label for="age">Age</label>
                <input type="number" id="age" required>

                <label for="bloodType">Blood Type</label>
                <input type="text" id="bloodType">

                <label for="subject">Subject</label>
                <select id="subject" required>
                    <option value="">Select Subject</option>
                    <option value="Mathematics">Mathematics</option>
                    <option value="English">English</option>
                    <option value="Civic Education"> civic Eduation</option>
                    <option value="Biology">Biology</option>
                    <option value="Chemistry">Chemistry</option>
                    <option value="Physics">Physics</option>
                    <option value="FurtherMaths">FurtherMaths</option>
                    <option value="Government"> Goverment</option>
                    <option value="Literature-in-english">Literature-in-english</option>
                    <option value="History">History</option>
                    <option value="CRS">CRS</option>
                    <option value="Economics"> Economics</option>
                    <option value="Finanical Accounting">Finanical Accounting</option>
                    <option value="Commerce">Commerce</option>
                    <option value="Booking Keeping">Booking Keeping</option>
                    <option value="Marketing"> Marketing</option>
                </select>    
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob">

                <label for="gender">Gender</label>
                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>

                <label for="PhoneNo">Phone No</label>
                <input type="text" maxlength="11" id="PhoneNo" placeholder="Phone number" required>
                    

                <button type="submit" id="submitButton">
                    Add Student
                </button>

            </form>

        </section>


        <!-- Student Management -->
        <section class="student-section">

            <h2>Registered Students</h2>

            <div class="student-info">
                <h3>
                    Total Students:
                    <span id="studentCount">0</span>
                </h3>

                <input
                    type="text"
                    id="searchStudent"
                    placeholder="Search student..."
                >
            </div>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>S/N</th>
                            <th>Student ID</th>
                            <th>Name</th>
                            <th>Class</th>
                            <th>Age</th>
                            <th>Blood Type</th>
                            <th>Subject</th>
                            <th>DOB</th>
                            <th>Gender</th>
                            <th>Phone No</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="studentTable">
                        <!-- JavaScript will add students here -->
                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <footer>
        <p>Thanks for your cooperation</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
